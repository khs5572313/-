<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눈 속의 등불 — The Lamp in the Snow</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Serif KR","Apple SD Gothic Neo",serif;color:#d9d4e8}
  #c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;cursor:pointer}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.55);transition:opacity .8s}
  #ui.on{opacity:0;pointer-events:none}
  #ui h1{font-weight:400;letter-spacing:.5em;font-size:22px;margin:0 0 6px;color:#efe6d6}
  #ui p{font-size:12px;letter-spacing:.25em;opacity:.65;margin:0 0 28px}
  #start{background:none;border:1px solid #cdb79a;color:#f2e2c8;padding:12px 30px;font-size:14px;letter-spacing:.3em;cursor:pointer;font-family:inherit}
  #start:hover{background:rgba(255,220,170,.08)}
  #help{position:absolute;bottom:22px;font-size:11px;opacity:.5;letter-spacing:.12em}
  #prog{position:absolute;left:0;right:0;bottom:0;height:10px;cursor:pointer;opacity:0;transition:opacity .3s}
  #prog:hover{opacity:1}
  #bar{height:3px;margin-top:7px;background:#e8c58e;width:0}
  body:not(.ready) #start{opacity:.3;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>눈 속의 등불</h1>
  <p>THE LAMP IN THE SNOW · 약 99초 · 사운드 포함</p>
  <button id="start">▶ 재생</button>
  <div id="help">스페이스: 일시정지 · ←/→: 5초 이동 · R: 처음부터 · 화면 클릭: 일시정지</div>
</div>
<div id="prog"><div id="bar"></div></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
